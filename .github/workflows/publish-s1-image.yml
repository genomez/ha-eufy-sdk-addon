name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.12
      IMAGE_ID: sha256:cb1b5640224f887c1dc47321cb6c2c024e97c41d68800fc9bb7fefee98a59619
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.12
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.12'
          expected = {'README.md': ('b53a1b3e19c7ddac6a6767e6445a85b23ea2ee8cf0bcfb59085214d9953c344a', 5756), 'REBUILD.md': ('ad9d1ea1b73bac856148480d630a1b7cc6386ba147946405133ef7ffceb0f833', 6726), 'SHA256SUMS': ('c8e24958bce7454c123050c9b4b3afa962198827a9f998b869464e506a609eda', 681), 'eufy-sdk-0.2.1-s1.experimental.12-source.tar.gz': ('7e3472b2ebd4734d0de738f9080d6b70df0117dbc3286b0eb9289fac6cd40093', 1627292), 'experimental-bridge-image.tar': ('62393a3de937a0b8f0051ec534caae85e8f80e108843fe2712d78e7a863e2e73', 743371776), 'final-context.tar': ('2e46b6c441e181c7f0c1d02c757fcf1d42e2476304d7ff269644f177554ef4a1', 12267520), 'genomez-eufy-sdk-0.2.1-s1.experimental.12.tgz': ('d717f4fb7514d732db76c711ff430ed592d0be7f0b0e6323dce288cda3c56b0e', 1879497), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.12.tgz': ('fed0d532975ed5b5bc410a9657978439adc288da146c21ae5296d5d476c2b8d7', 138720)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '62393a3de937a0b8f0051ec534caae85e8f80e108843fe2712d78e7a863e2e73  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'README.md': {'bytes': 5756, 'sha256': 'b53a1b3e19c7ddac6a6767e6445a85b23ea2ee8cf0bcfb59085214d9953c344a'}, 'REBUILD.md': {'bytes': 6726, 'sha256': 'ad9d1ea1b73bac856148480d630a1b7cc6386ba147946405133ef7ffceb0f833'}, 'SHA256SUMS': {'bytes': 681, 'sha256': 'c8e24958bce7454c123050c9b4b3afa962198827a9f998b869464e506a609eda'}, 'eufy-sdk-0.2.1-s1.experimental.12-source.tar.gz': {'bytes': 1627292, 'sha256': '7e3472b2ebd4734d0de738f9080d6b70df0117dbc3286b0eb9289fac6cd40093'}, 'experimental-bridge-image.tar': {'bytes': 743371776, 'sha256': '62393a3de937a0b8f0051ec534caae85e8f80e108843fe2712d78e7a863e2e73'}, 'final-context.tar': {'bytes': 12267520, 'sha256': '2e46b6c441e181c7f0c1d02c757fcf1d42e2476304d7ff269644f177554ef4a1'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.12.tgz': {'bytes': 1879497, 'sha256': 'd717f4fb7514d732db76c711ff430ed592d0be7f0b0e6323dce288cda3c56b0e'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.12.tgz': {'bytes': 138720, 'sha256': 'fed0d532975ed5b5bc410a9657978439adc288da146c21ae5296d5d476c2b8d7'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:8b4926cd74e9b1f3aedeb0983ef59f77dabdada731e4ddd155bc952adb642006']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 4
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.12'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:8b4926cd74e9b1f3aedeb0983ef59f77dabdada731e4ddd155bc952adb642006']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.12', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
