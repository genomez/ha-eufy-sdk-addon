name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.16
      IMAGE_ID: sha256:2aa0ab08ec503875a2e0914ca80ae8a7330576099376896c5943565b63501482
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.16
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          sources = {'eufy-sdk': '2b207cc1eb0dd98ea2e21bdc02c9ccbb0d4a09fd', 'ha-eufy-sdk-bridge': '744e986345cab38aa1e40e692f69ee0f1acdf636', 'ha-eufy-sdk': '2942757c5b16af520ff613fdf2e6722a07cc9088'}
          for repo, expected in sources.items():
              actual = json.loads(subprocess.check_output(['gh', 'api', 'repos/genomez/' + repo + '/git/ref/heads/s1-experimental']))['object']['sha']
              assert actual == expected, 'Publication source head changed: ' + repo
          PY
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.16'
          expected = {'eufy-sdk-0.2.1-s1.experimental.16-source.tar.gz': ('e9d390f3f723d52b3da205b76d9fb2e67ee5d8d84daec39048dab15f0937b656', 1902453), 'experimental-bridge-image.tar': ('a0c5607ad268eaad619f7a6850d0e3d1645c6334ecc4baedb6eee0e1eebe04f4', 748812288), 'final-context.tar': ('2d94a59500d27f3ce741667cbc857bdc3f442b753fb4019f6051d05ed50b288a', 17694720), 'genomez-eufy-sdk-0.2.1-s1.experimental.16.tgz': ('de5561af7a1d8e72ff72710d08b94953d33fc3982183818cbd16e3c9cf5f5c6c', 2130436), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.16.tgz': ('31d75422700a8d5ceb2c56f4fdc502a5161cdba8d3929b33650b0b3ca8202966', 250449), 'PRIVACY.md': ('d83f82b80f7057aa712b8fa479dac379709db9e8e1653ab40d42f91e9daa4530', 1316), 'README.md': ('33a5b1c0ec62be9bc2458d55f962a6d959d056406f30d1be3eeb727c51d2b61a', 1933), 'REBUILD.md': ('4b00a9e5a996f428330e91a3999edb808c7f4a80f1aa66b48b02b14e5dc561b0', 1538), 'RELEASE_NOTES.md': ('3f74812fffb86bd323d238f007c376024bb77044134a246e6008a417249896ab', 2605), 'ZIP_CONTENTS.json': ('4408142961e657f0bcc066f78eddcbf5e3aa5ad0470949202a5551cfd1f0bba3', 12424), 'SHA256SUMS': ('ce87952faa332ca5a9c95f32e5f27c007d597f8e623366ff61a6e2ed4114551c', 1146)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' 'a0c5607ad268eaad619f7a6850d0e3d1645c6334ecc4baedb6eee0e1eebe04f4  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.16-source.tar.gz': {'bytes': 1902453, 'sha256': 'e9d390f3f723d52b3da205b76d9fb2e67ee5d8d84daec39048dab15f0937b656'}, 'experimental-bridge-image.tar': {'bytes': 748812288, 'sha256': 'a0c5607ad268eaad619f7a6850d0e3d1645c6334ecc4baedb6eee0e1eebe04f4'}, 'final-context.tar': {'bytes': 17694720, 'sha256': '2d94a59500d27f3ce741667cbc857bdc3f442b753fb4019f6051d05ed50b288a'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.16.tgz': {'bytes': 2130436, 'sha256': 'de5561af7a1d8e72ff72710d08b94953d33fc3982183818cbd16e3c9cf5f5c6c'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.16.tgz': {'bytes': 250449, 'sha256': '31d75422700a8d5ceb2c56f4fdc502a5161cdba8d3929b33650b0b3ca8202966'}, 'PRIVACY.md': {'bytes': 1316, 'sha256': 'd83f82b80f7057aa712b8fa479dac379709db9e8e1653ab40d42f91e9daa4530'}, 'README.md': {'bytes': 1933, 'sha256': '33a5b1c0ec62be9bc2458d55f962a6d959d056406f30d1be3eeb727c51d2b61a'}, 'REBUILD.md': {'bytes': 1538, 'sha256': '4b00a9e5a996f428330e91a3999edb808c7f4a80f1aa66b48b02b14e5dc561b0'}, 'RELEASE_NOTES.md': {'bytes': 2605, 'sha256': '3f74812fffb86bd323d238f007c376024bb77044134a246e6008a417249896ab'}, 'ZIP_CONTENTS.json': {'bytes': 12424, 'sha256': '4408142961e657f0bcc066f78eddcbf5e3aa5ad0470949202a5551cfd1f0bba3'}, 'SHA256SUMS': {'bytes': 1146, 'sha256': 'ce87952faa332ca5a9c95f32e5f27c007d597f8e623366ff61a6e2ed4114551c'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          gh release download 0.3.1-s1.experimental.16 --repo genomez/ha-eufy-sdk --pattern '*.zip*'
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:1df5e3b86ae84335a50e22b2989d7757dd17115d4452687d775b53256b7fc8c9']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 5
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.16'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:1df5e3b86ae84335a50e22b2989d7757dd17115d4452687d775b53256b7fc8c9']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.16', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
