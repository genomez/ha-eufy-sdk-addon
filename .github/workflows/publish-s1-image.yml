name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.17
      IMAGE_ID: sha256:aa1303d06a62853c6792a7d8b7aeb87d343c76e453c5f254e137df5fe504087f
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.17
      INTEGRATION_RELEASE_TAG: 0.3.1-s1.experimental.17
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          sources = {'eufy-sdk': 'd0769144fcd9d33101c275a6ccc183c2e40c2889', 'ha-eufy-sdk-bridge': '8aacb68460004e9102f5e5f6a968e9a29f396a9f', 'ha-eufy-sdk': '98b1626d75a31afd0159f3ab82a7bdf1c35331ca'}
          for repo, expected in sources.items():
              actual = json.loads(subprocess.check_output(['gh', 'api', 'repos/genomez/' + repo + '/git/ref/heads/s1-experimental']))['object']['sha']
              assert actual == expected, 'Publication source head changed: ' + repo
          PY
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          releases = [
              (os.environ['GH_REPO'], os.environ['RELEASE_TAG'], Path('.'), {
                  'PRIVACY.md': (688, '71d718f47c97ef0078766dd61df11d9ee5cb13c13adda5cdf9eceb9a10f46ae0'),
                  'README.md': (1347, '785f653dd5d47ed8e6aafd9e1292fac9783e560472b1741332e108abd4c5fbe1'),
                  'REBUILD.md': (1374, '1c19fec7d6f775fe79eee3e59352be1f738016a7190eb507419769c9be6332c3'),
                  'RELEASE_NOTES.md': (1846, '271e576b5be84019b4e9f1b73277a51774a06e30b3d90a1c12da81fdf40f33bb'),
                  'SHA256SUMS': (1270, '629dea5b747316c239812ce0563d46304c815609245d99a1589ca612b76c10e5'),
                  'ZIP_CONTENTS.json': (12734, '133af959cc763584054a7898a0cfaadddb099a47e60ab208a44f108367e68442'),
                  'eufy-sdk-0.2.1-s1.experimental.17-source.tar.gz': (1948184, 'fa63e1f199829dd66849cc6e7aa2bb48866faa9fd1809042b1d0bbf28388357a'),
                  'experimental-bridge-image.tar': (751610880, 'ca2f59c78e02b94edea8bbe4695d2f68e1a31c01bd26e6de33e91f3916117218'),
                  'final-context.tar': (20490240, 'ed2b10d5d1881656e474dedc61a23393dfc9d454ed727afae9c3752e00df623b'),
                  'genomez-eufy-sdk-0.2.1-s1.experimental.17.tgz': (2177818, 'a13c6153af818519851fa257a9a718002abdf732056362f1fc422125e15edf4e'),
                  'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.17.tgz': (257554, '5bbedfd39f8d3229c66fe88cbf416d309739abf622d3e832a0be94e3714b8d74'),
                  'ha-eufy-sdk-bridge-0.3.1-s1.experimental.17-source.tar.gz': (596485, '93c07fc1e82f1e325b8c5566faef01ba43216a2689ee32c35da8cafd918fc315'),
              }),
              ('genomez/ha-eufy-sdk', os.environ['INTEGRATION_RELEASE_TAG'], Path('integration'), {
                  'eufy-sdk-s1-0.3.1-s1.experimental.17.zip': (1115085, '440295e5722186d92b0160025db4dcf2695768dfda2a8a0ddd8e0dfbb0047ff9'),
                  'eufy-sdk-s1-0.3.1-s1.experimental.17.zip.sha256': (107, 'eeecd3258a8d64641f1d9e670753f131c01c494455b5f613dc6f482c041cd963'),
              }),
          ]
          for repo, tag, directory, expected in releases:
              release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
              assert release['draft'] is False and release['prerelease'] is True
              assert release['tag_name'] == tag
              actual = {a['name']: a for a in release['assets']}
              assert set(actual) == set(expected) and len(release['assets']) == len(expected), tag
              for name, (size, digest) in expected.items():
                  assert actual[name]['size'] == size, name
                  assert actual[name]['digest'] == 'sha256:' + digest, name
              directory.mkdir(exist_ok=True)
              subprocess.check_call(['gh', 'release', 'download', tag, '--repo', repo, '--pattern', '*', '--dir', str(directory)])
              for name, (size, digest) in expected.items():
                  path = directory / name
                  assert path.stat().st_size == size, name
                  with path.open('rb') as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest, name
          PY
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:1df5e3b86ae84335a50e22b2989d7757dd17115d4452687d775b53256b7fc8c9']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 5
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.17'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:5d5ec5d326ebbbb26901550164e2262e9b13ff9a98f69a7790eec6563a916f5e']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.17', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
