name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.14
      IMAGE_ID: sha256:4caccb7076947394142d68313ae15c41ad7134edf3e32caa7c2f7e60be18204f
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.14
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.14'
          expected = {'eufy-sdk-0.2.1-s1.experimental.14-source.tar.gz': ('bab7b2122918b73e4092efc0366e1ca87c7bb08748b9020ed04c8c3a8a4f47d5', 1779430), 'experimental-bridge-image.tar': ('913f20af06cfd81f679c2fe6f240a50bac5d81b6b8bdda4d78ef65d125ae641f', 744518656), 'final-context.tar': ('175bbe0e2e0dd6f006ef80c3d2aece75f3e5789da708b8f3d6788973d805ca7c', 13404160), 'genomez-eufy-sdk-0.2.1-s1.experimental.14.tgz': ('0e7e5cb204f50b8700e2d98a3bc62815e42444785b030ddc46db2fdbadb3953a', 2024105), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.14.tgz': ('2919bf1bf115dcddcdb32a8a9cace2b105153d3fa940bff8fc94ca3bb2d5b923', 234255), 'README.md': ('f67ac2d88930943d2645b43fc35ff324a7ab27c2c44cb21f23a90eb3bf4edcc4', 4460), 'REBUILD.md': ('75fac609a64b9d53b3af261994f2f3adfb1720e0591a08e9de88c7e59d4cb94d', 3356), 'SHA256SUMS': ('f7c5042708ebb56913ea7175a0626f3989d3b9241868ce30048d8dd71bcc865e', 681)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '913f20af06cfd81f679c2fe6f240a50bac5d81b6b8bdda4d78ef65d125ae641f  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.14-source.tar.gz': {'bytes': 1779430, 'sha256': 'bab7b2122918b73e4092efc0366e1ca87c7bb08748b9020ed04c8c3a8a4f47d5'}, 'experimental-bridge-image.tar': {'bytes': 744518656, 'sha256': '913f20af06cfd81f679c2fe6f240a50bac5d81b6b8bdda4d78ef65d125ae641f'}, 'final-context.tar': {'bytes': 13404160, 'sha256': '175bbe0e2e0dd6f006ef80c3d2aece75f3e5789da708b8f3d6788973d805ca7c'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.14.tgz': {'bytes': 2024105, 'sha256': '0e7e5cb204f50b8700e2d98a3bc62815e42444785b030ddc46db2fdbadb3953a'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.14.tgz': {'bytes': 234255, 'sha256': '2919bf1bf115dcddcdb32a8a9cace2b105153d3fa940bff8fc94ca3bb2d5b923'}, 'README.md': {'bytes': 4460, 'sha256': 'f67ac2d88930943d2645b43fc35ff324a7ab27c2c44cb21f23a90eb3bf4edcc4'}, 'REBUILD.md': {'bytes': 3356, 'sha256': '75fac609a64b9d53b3af261994f2f3adfb1720e0591a08e9de88c7e59d4cb94d'}, 'SHA256SUMS': {'bytes': 681, 'sha256': 'f7c5042708ebb56913ea7175a0626f3989d3b9241868ce30048d8dd71bcc865e'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:8bcfb93cf8d1fb25adb892c847d2de14acb392f720b8b950e69c90222c6e57df']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 5
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.14'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:8bcfb93cf8d1fb25adb892c847d2de14acb392f720b8b950e69c90222c6e57df']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.14', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
