name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.15
      IMAGE_ID: sha256:a4099761908f536619441b2ae8e7f2abc9262cecbf65d4b9668f1fd369346324
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.15
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          sources = {'eufy-sdk': '18b34fffdaf57e1e2756df51c42022c63d022704', 'ha-eufy-sdk-bridge': 'd3b0d3f4d04ca5f63b03946622be1266eafe5069', 'ha-eufy-sdk': '558b738ed662ca6f055fa31da0199e73fcb7c52d'}
          for repo, expected in sources.items():
              actual = json.loads(subprocess.check_output(['gh', 'api', 'repos/genomez/' + repo + '/git/ref/heads/s1-experimental']))['object']['sha']
              assert actual == expected, 'Publication source head changed: ' + repo
          PY
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.15'
          expected = {'eufy-sdk-0.2.1-s1.experimental.15-source.tar.gz': ('cdad1a1f67dec48e523360e96ae0a9b0415fa9034e73832074e1541c21661eb7', 1839203), 'experimental-bridge-image.tar': ('829e838af583a81085f164bf03b0f9fcd61bb2efd90773201bde7974c46d5339', 746688512), 'final-context.tar': ('7076ab7dc2ed65cdd676916f30a4c094be3b4a5da1fade1c5ba6db623a6ec86a', 15575040), 'genomez-eufy-sdk-0.2.1-s1.experimental.15.tgz': ('490fef82fa23570f2e5fcee15b87f837e88f1be397194665b6cf7c2d28c49c23', 2083702), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.15.tgz': ('c22259977d814d749477eaf365118c27d0b372595d0f029b7867206ec6fdd832', 248630), 'README.md': ('ce2a62730a956eb6e60ac40a8a2a1b1bcd5cd7f9f253df690fc36fb55368fef8', 1793), 'REBUILD.md': ('f28fbe330dab43171d1392df7b251e296c2c5ae92f7a9ca95f2bd731db412393', 1538), 'SHA256SUMS': ('a12fd4c5ea04abd9b55ba01df00889b8c482a227767f96e79df3b7b60969e6b6', 681)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '829e838af583a81085f164bf03b0f9fcd61bb2efd90773201bde7974c46d5339  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.15-source.tar.gz': {'bytes': 1839203, 'sha256': 'cdad1a1f67dec48e523360e96ae0a9b0415fa9034e73832074e1541c21661eb7'}, 'experimental-bridge-image.tar': {'bytes': 746688512, 'sha256': '829e838af583a81085f164bf03b0f9fcd61bb2efd90773201bde7974c46d5339'}, 'final-context.tar': {'bytes': 15575040, 'sha256': '7076ab7dc2ed65cdd676916f30a4c094be3b4a5da1fade1c5ba6db623a6ec86a'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.15.tgz': {'bytes': 2083702, 'sha256': '490fef82fa23570f2e5fcee15b87f837e88f1be397194665b6cf7c2d28c49c23'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.15.tgz': {'bytes': 248630, 'sha256': 'c22259977d814d749477eaf365118c27d0b372595d0f029b7867206ec6fdd832'}, 'README.md': {'bytes': 1793, 'sha256': 'ce2a62730a956eb6e60ac40a8a2a1b1bcd5cd7f9f253df690fc36fb55368fef8'}, 'REBUILD.md': {'bytes': 1538, 'sha256': 'f28fbe330dab43171d1392df7b251e296c2c5ae92f7a9ca95f2bd731db412393'}, 'SHA256SUMS': {'bytes': 681, 'sha256': 'a12fd4c5ea04abd9b55ba01df00889b8c482a227767f96e79df3b7b60969e6b6'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:3c27d30849c6a499ce3484ae8ada57ebd7abcd2ec07dcffa7a4b93ebda32acb5']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 5
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.15'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:b9847a793e9262e1995513dd0178da54d2449d4ce4810bb9de60d9eeaae29e4d', 'sha256:3c27d30849c6a499ce3484ae8ada57ebd7abcd2ec07dcffa7a4b93ebda32acb5']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.15', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
