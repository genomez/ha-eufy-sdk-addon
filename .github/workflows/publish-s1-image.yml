name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.8
      IMAGE_ID: sha256:2dd51f74ef63af80abb21c89a21ab602a3f69c83dbcb6d8608a31de86ba347f2
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.8
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.8'
          expected = {'eufy-sdk-0.2.1-s1.experimental.8-source.tar.gz': ('bdda83514ad9b53d28963c49b7cbdaaa1942e5f7f122bef4198d4831762e940a', 1628731), 'experimental-bridge-image.tar': ('9439349d84482548f30a6e3416c218c447966af6e81dd08dade22776f4487b9d', 742427648), 'final-context.tar': ('4f54a6f6362ed67fe3d3e2c8edcfc365aa760a7d8d5960751d20f9c3e00860af', 11325440), 'genomez-eufy-sdk-0.2.1-s1.experimental.8.tgz': ('ab4d3bb1170dcae45535058da39b7c1a821274603144f5c916068a8914398b77', 1886913), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.8.tgz': ('800e798e717618c83c63b67dd54c2cf2594cac724922525323fd70ede9ed0ec7', 130777), 'README.md': ('a8dcb30b07384ec3e79abb1aba65a79fd19cea231009badd33707087c738af0f', 4101), 'REBUILD.md': ('fa48318302564d921268fe85713bc788a5a71975e7aaf92505fda489a1d0e90d', 9721), 'SHA256SUMS': ('60304a412cad9eab1647e2361a02bef0b958fe7470891fb4f48ee376cc335f8a', 678)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '9439349d84482548f30a6e3416c218c447966af6e81dd08dade22776f4487b9d  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.8-source.tar.gz': {'bytes': 1628731, 'sha256': 'bdda83514ad9b53d28963c49b7cbdaaa1942e5f7f122bef4198d4831762e940a'}, 'experimental-bridge-image.tar': {'bytes': 742427648, 'sha256': '9439349d84482548f30a6e3416c218c447966af6e81dd08dade22776f4487b9d'}, 'final-context.tar': {'bytes': 11325440, 'sha256': '4f54a6f6362ed67fe3d3e2c8edcfc365aa760a7d8d5960751d20f9c3e00860af'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.8.tgz': {'bytes': 1886913, 'sha256': 'ab4d3bb1170dcae45535058da39b7c1a821274603144f5c916068a8914398b77'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.8.tgz': {'bytes': 130777, 'sha256': '800e798e717618c83c63b67dd54c2cf2594cac724922525323fd70ede9ed0ec7'}, 'README.md': {'bytes': 4101, 'sha256': 'a8dcb30b07384ec3e79abb1aba65a79fd19cea231009badd33707087c738af0f'}, 'REBUILD.md': {'bytes': 9721, 'sha256': 'fa48318302564d921268fe85713bc788a5a71975e7aaf92505fda489a1d0e90d'}, 'SHA256SUMS': {'bytes': 678, 'sha256': '60304a412cad9eab1647e2361a02bef0b958fe7470891fb4f48ee376cc335f8a'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.8'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:3c1ac57765f2447848c77950147a6db695226b7667e94c511a19daad71edc1f8']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.8', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
