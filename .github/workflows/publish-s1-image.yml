name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.9
      IMAGE_ID: sha256:dd0c396bc96beb74cf97a910ad78e5ba276fcc7270052f29bd62beb39722f5a1
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.9
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.9'
          expected = {'eufy-sdk-0.2.1-s1.experimental.9-source.tar.gz': ('f26cbf602c0c231a5c5170c169e400f19f855a69e85225ed82667431fb2e8613', 1630064), 'experimental-bridge-image.tar': ('41ee9cba77f60e04789c49304f01faa7a156391a14f8e5639e29cfe95db86931', 742442496), 'final-context.tar': ('33ec25a8a90b08baf762376483629eb1cc1e7cf02e0a0224728e55e42af02ab4', 11345920), 'genomez-eufy-sdk-0.2.1-s1.experimental.9.tgz': ('39673f48efdb33ce8a91bccfaecf428cad4e128ee18a52cb56d9ab8a8b055848', 1888831), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.9.tgz': ('a4bbf99003063f2b8c9407b5f44e01076a6b2666265636234da0a05f936c572e', 132864), 'README.md': ('b95748e33ae8a5af0032b47d497acc4f6542497077a5a852e6382971aabd5182', 6535), 'REBUILD.md': ('3a0ecf40aeadbb738f0fbdfaecb2ca6ebee8839059119d4e21fa1ee685a90c5a', 12155), 'SHA256SUMS': ('c22dff60a56fa1a0ded4a771dd0e3cf5e6643503f0d48e430775619f0196973d', 678)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '41ee9cba77f60e04789c49304f01faa7a156391a14f8e5639e29cfe95db86931  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.9-source.tar.gz': {'bytes': 1630064, 'sha256': 'f26cbf602c0c231a5c5170c169e400f19f855a69e85225ed82667431fb2e8613'}, 'experimental-bridge-image.tar': {'bytes': 742442496, 'sha256': '41ee9cba77f60e04789c49304f01faa7a156391a14f8e5639e29cfe95db86931'}, 'final-context.tar': {'bytes': 11345920, 'sha256': '33ec25a8a90b08baf762376483629eb1cc1e7cf02e0a0224728e55e42af02ab4'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.9.tgz': {'bytes': 1888831, 'sha256': '39673f48efdb33ce8a91bccfaecf428cad4e128ee18a52cb56d9ab8a8b055848'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.9.tgz': {'bytes': 132864, 'sha256': 'a4bbf99003063f2b8c9407b5f44e01076a6b2666265636234da0a05f936c572e'}, 'README.md': {'bytes': 6535, 'sha256': 'b95748e33ae8a5af0032b47d497acc4f6542497077a5a852e6382971aabd5182'}, 'REBUILD.md': {'bytes': 12155, 'sha256': '3a0ecf40aeadbb738f0fbdfaecb2ca6ebee8839059119d4e21fa1ee685a90c5a'}, 'SHA256SUMS': {'bytes': 678, 'sha256': 'c22dff60a56fa1a0ded4a771dd0e3cf5e6643503f0d48e430775619f0196973d'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.9'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:7f4be7c2eb5d643f3f4905f9ea2b1a29f9cd107baf6ea8be2f6e3ec80b77caea']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.9', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
