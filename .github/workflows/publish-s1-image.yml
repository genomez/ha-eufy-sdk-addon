name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.6
      IMAGE_ID: sha256:0cd6293ee618e3ec74b30bb74230992debe182b137f615e464750720460ac7a5
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.6
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.6'
          expected = {
              'README.md': ('02afe29b8d3041b87c690895666b580ac4bad1b2ae5c5bd88b8bec36f060e815', 2161),
              'REBUILD.md': ('4426ac05f7075e80c131ba40014a0ad8901d5240be6a8fa531bab89e3963e21b', 8353),
              'SHA256SUMS': ('d6e8881bf6e7f1605240414bc83df3f8aa611b42c752620f88fe060452d44b61', 678),
              'eufy-sdk-0.2.1-s1.experimental.6-source.tar.gz': ('6e67b5b5c030d7062c3f802673e93a3f5917d8fb3c59f81d1aeb384358ac3f2c', 1508369),
              'experimental-bridge-image.tar': ('8e1e8a93efb7d81d9d2dde3f93c10e8887efb1c641014d28ba6c5c9a8be94a69', 738032640),
              'final-context.tar': ('f7a795ad62dd91310f06bff8bde7bd27bb2a86963702c6b5cbf293ccaa7f016d', 7567360),
              'genomez-eufy-sdk-0.2.1-s1.experimental.6.tgz': ('aa60bdbb8a8205fdc35a059e2295a2f63f25df64dbb8d805b3c48e1d0c8b39ae', 1769689),
              'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.6.tgz': ('83f6475af16f5b9e0c0918dfc8a10c9c1728a821a7602bee5356323eae3a8d9e', 109285),
          }
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '8e1e8a93efb7d81d9d2dde3f93c10e8887efb1c641014d28ba6c5c9a8be94a69  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.6-source.tar.gz': {'bytes': 1508369, 'sha256': '6e67b5b5c030d7062c3f802673e93a3f5917d8fb3c59f81d1aeb384358ac3f2c'}, 'experimental-bridge-image.tar': {'bytes': 738032640, 'sha256': '8e1e8a93efb7d81d9d2dde3f93c10e8887efb1c641014d28ba6c5c9a8be94a69'}, 'final-context.tar': {'bytes': 7567360, 'sha256': 'f7a795ad62dd91310f06bff8bde7bd27bb2a86963702c6b5cbf293ccaa7f016d'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.6.tgz': {'bytes': 1769689, 'sha256': 'aa60bdbb8a8205fdc35a059e2295a2f63f25df64dbb8d805b3c48e1d0c8b39ae'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.6.tgz': {'bytes': 109285, 'sha256': '83f6475af16f5b9e0c0918dfc8a10c9c1728a821a7602bee5356323eae3a8d9e'}, 'README.md': {'bytes': 2161, 'sha256': '02afe29b8d3041b87c690895666b580ac4bad1b2ae5c5bd88b8bec36f060e815'}, 'REBUILD.md': {'bytes': 8353, 'sha256': '4426ac05f7075e80c131ba40014a0ad8901d5240be6a8fa531bab89e3963e21b'}, 'SHA256SUMS': {'bytes': 678, 'sha256': 'd6e8881bf6e7f1605240414bc83df3f8aa611b42c752620f88fe060452d44b61'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.6'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:97b3b99c630691feda191b7f7f9da114c7f451c0f2f2b9bf7f94eb0969d1499d', 'sha256:a881d02e14378a8d1bb3c309d6e2420febb57e743d9237aec7a15811a6beef51', 'sha256:be2f8cdd941e1b98d70014828659ca50f0b8bdc9bab1d470be61c6fd4ca01bd4', 'sha256:44ab3f04d02f0454e05d83048b8ce53677c83af7e57197927552efd4b2221ee1', 'sha256:6d67526d3fc1990db95d7a760119a07e3adc399581f3e4afb56906db2238e424']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.6', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
