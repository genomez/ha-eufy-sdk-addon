name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.11
      IMAGE_ID: sha256:bded899a6e0f5fe07164c0de993e18caa085e643979bf4d395bfe32cb76a59d7
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.11
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.11'
          expected = {'README.md': ('e6530475a850ccd7eeed76395b6e89139cd02f1c58bbb716fb7ab2a3feb9c6b0', 5889), 'REBUILD.md': ('f9e79a29fa513a9ce7080d1bef00aeeeb8c84f576f23cce5128d04f4b93ae103', 19517), 'SHA256SUMS': ('2cd1afa563ff93ae293e14d69cef81747f6545761db38ad2e9190c40d667bb34', 681), 'eufy-sdk-0.2.1-s1.experimental.11-source.tar.gz': ('d49311318a9522d7cdc6ebb0bddaeaa12bd7d8df383688b414ed294c2b03d465', 1619648), 'experimental-bridge-image.tar': ('6c524572469a500b68bc2bfed49b9d80b02afed6bed7bd035e7f55c0228b06f4', 743215104), 'final-context.tar': ('3b8ae1d0f2ed766ccaff2c4a5e05fd8890d5b8bc0eea615c5f552ee324dac908', 12113920), 'genomez-eufy-sdk-0.2.1-s1.experimental.11.tgz': ('a466b74e55f5193a4ecc0e6c4066d7ef5075ea5f9f15d1ac91f3db8b2b621973', 1875710), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.11.tgz': ('ed42805367792ecb434989016fa30325ba7bc43f6933d80cee00ee267b8a5e1b', 137321)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '6c524572469a500b68bc2bfed49b9d80b02afed6bed7bd035e7f55c0228b06f4  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'README.md': {'bytes': 5889, 'sha256': 'e6530475a850ccd7eeed76395b6e89139cd02f1c58bbb716fb7ab2a3feb9c6b0'}, 'REBUILD.md': {'bytes': 19517, 'sha256': 'f9e79a29fa513a9ce7080d1bef00aeeeb8c84f576f23cce5128d04f4b93ae103'}, 'SHA256SUMS': {'bytes': 681, 'sha256': '2cd1afa563ff93ae293e14d69cef81747f6545761db38ad2e9190c40d667bb34'}, 'eufy-sdk-0.2.1-s1.experimental.11-source.tar.gz': {'bytes': 1619648, 'sha256': 'd49311318a9522d7cdc6ebb0bddaeaa12bd7d8df383688b414ed294c2b03d465'}, 'experimental-bridge-image.tar': {'bytes': 743215104, 'sha256': '6c524572469a500b68bc2bfed49b9d80b02afed6bed7bd035e7f55c0228b06f4'}, 'final-context.tar': {'bytes': 12113920, 'sha256': '3b8ae1d0f2ed766ccaff2c4a5e05fd8890d5b8bc0eea615c5f552ee324dac908'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.11.tgz': {'bytes': 1875710, 'sha256': 'a466b74e55f5193a4ecc0e6c4066d7ef5075ea5f9f15d1ac91f3db8b2b621973'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.11.tgz': {'bytes': 137321, 'sha256': 'ed42805367792ecb434989016fa30325ba7bc43f6933d80cee00ee267b8a5e1b'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:0efce49c5dd87efa45cf54019e52a921a1d9dd7f52f8c100a03dea1b697efbed']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 4
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.11'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:0efce49c5dd87efa45cf54019e52a921a1d9dd7f52f8c100a03dea1b697efbed']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.11', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
