name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.13
      IMAGE_ID: sha256:98915362363771ca8c2a248d2a90bbc30c0ffae147dd4b3a5d4f22ca0e16504e
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.13
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.13'
          expected = {'eufy-sdk-0.2.1-s1.experimental.13-source.tar.gz': ('26fd719eaed739283315b6636e97b14427fe1e624f348c82cd3025d342f2d662', 1769324), 'experimental-bridge-image.tar': ('921c7004051e0ba27632be0b221d0843d346f3365c54a099dd787cc7fe14c5f0', 744531456), 'final-context.tar': ('9eb2407dcd60d5520367367338c39b1f55fcebc2c17a1e4785386e04fc99cd6f', 13424640), 'genomez-eufy-sdk-0.2.1-s1.experimental.13.tgz': ('67a7a0dfbce3387909b621e0aa21d47e1a71828307bb2074c4f5e41eaa60e438', 2037097), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.13.tgz': ('2dce2566f5721d24741c35064ca33dd946b71c5e0072b6fc82b9a745160a82d5', 229197), 'README.md': ('b7476048d8a12c68c4275dc8cbf09c4732159dfce825a7965cbadfebf0f34758', 6686), 'REBUILD.md': ('ea5661b932a994a418c884dffc43c01e92686dfeafa939884d9a8790aaf9bced', 3284), 'SHA256SUMS': ('c475b21abdc6216da659e6f84649c0c751737242bde683e21d340fd1c9ae06f7', 681)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' '921c7004051e0ba27632be0b221d0843d346f3365c54a099dd787cc7fe14c5f0  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.13-source.tar.gz': {'bytes': 1769324, 'sha256': '26fd719eaed739283315b6636e97b14427fe1e624f348c82cd3025d342f2d662'}, 'experimental-bridge-image.tar': {'bytes': 744531456, 'sha256': '921c7004051e0ba27632be0b221d0843d346f3365c54a099dd787cc7fe14c5f0'}, 'final-context.tar': {'bytes': 13424640, 'sha256': '9eb2407dcd60d5520367367338c39b1f55fcebc2c17a1e4785386e04fc99cd6f'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.13.tgz': {'bytes': 2037097, 'sha256': '67a7a0dfbce3387909b621e0aa21d47e1a71828307bb2074c4f5e41eaa60e438'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.13.tgz': {'bytes': 229197, 'sha256': '2dce2566f5721d24741c35064ca33dd946b71c5e0072b6fc82b9a745160a82d5'}, 'README.md': {'bytes': 6686, 'sha256': 'b7476048d8a12c68c4275dc8cbf09c4732159dfce825a7965cbadfebf0f34758'}, 'REBUILD.md': {'bytes': 3284, 'sha256': 'ea5661b932a994a418c884dffc43c01e92686dfeafa939884d9a8790aaf9bced'}, 'SHA256SUMS': {'bytes': 681, 'sha256': 'c475b21abdc6216da659e6f84649c0c751737242bde683e21d340fd1c9ae06f7'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, tarfile, os
          with tarfile.open('experimental-bridge-image.tar') as t:
              m = json.load(t.extractfile('manifest.json'))
              assert len(m) == 1
              raw = t.extractfile(m[0]['Config']).read()
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == os.environ['IMAGE_ID']
              config = json.loads(raw)
              assert config['rootfs']['diff_ids'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:90c769c728da7a721354bddd1ba2b5008fd705041398ce8c6ef77c6a1d442e8a']
              assert len(m[0]['Layers']) == len(config['rootfs']['diff_ids']) == 4
              for name, diffid in zip(m[0]['Layers'], config['rootfs']['diff_ids'], strict=True):
                  with t.extractfile(name) as stream:
                      assert 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == diffid
          PY
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.13'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:90c769c728da7a721354bddd1ba2b5008fd705041398ce8c6ef77c6a1d442e8a']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.13', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
