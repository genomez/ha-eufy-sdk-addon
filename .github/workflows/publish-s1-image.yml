name: Publish verified S1 image

on:
  push:
    branches: [s1-experimental]
    paths: [.github/workflows/publish-s1-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: s1-experimental-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'genomez/ha-eufy-sdk-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: genomez/ha-eufy-sdk-addon
      RELEASE_TAG: s1-runtime-0.4.1.experimental.7
      IMAGE_ID: sha256:b2890965263078f8f3ba675476610f42c6d91d06f18c76e191e516070a7ce861
      IMAGE_TAG: ghcr.io/genomez/eufy-sdk-s1-amd64:0.4.1-s1.experimental.7
    steps:
      - name: Verify source delivery and load the accepted image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1-delivery"
          cd "$RUNNER_TEMP/s1-delivery"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > assets.json
          python3 - <<'PY'
          import json
          r = json.load(open('assets.json'))
          assert r['draft'] is False and r['prerelease'] is True
          assert r['tag_name'] == 's1-runtime-0.4.1.experimental.7'
          expected = {'eufy-sdk-0.2.1-s1.experimental.7-source.tar.gz': ('b97be2650f9a787230611c5c49941e51be697dea848ead8ba7f1d62d51e05055', 1578814), 'experimental-bridge-image.tar': ('e73cec30e41645286d5438c780147cce1742d69b939329ffe59885739de14dd1', 739129856), 'final-context.tar': ('b6ba76057665a0773fb1f9f25be1984ce1075d2eaa55359a0eb061356bca2909', 8775680), 'genomez-eufy-sdk-0.2.1-s1.experimental.7.tgz': ('19bf92f2062ae103ede942896ffa1310996778b5a9a5876b9ae2c9df91c60ffe', 1845615), 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.7.tgz': ('592fb6ae22edca39c80978c73e245ac9f88938fbbdf4d6cfaa40f3fc7dc5d3bc', 120466), 'README.md': ('47aca26b10e3abbfec524274e19e0575a665f70edee714d2daaa32d0663bdd93', 1502), 'REBUILD.md': ('179f3e0b3615262943b28fe5a241017e671a0e767b513d4a10d571aa7565be59', 7265), 'SHA256SUMS': ('ac619d1043e42a17220f3ae9941d4a165c21b9c0497c255836872e0c3ded0e48', 678)}
          actual = {a['name']: a for a in r['assets']}
          assert set(actual) == set(expected) and len(r['assets']) == len(expected)
          for name, (digest, size) in expected.items():
              assert actual[name]['size'] == size, name
              assert actual[name]['digest'] == 'sha256:' + digest, name
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*'
          printf '%s\n' 'e73cec30e41645286d5438c780147cce1742d69b939329ffe59885739de14dd1  experimental-bridge-image.tar' | sha256sum --check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'eufy-sdk-0.2.1-s1.experimental.7-source.tar.gz': {'bytes': 1578814, 'sha256': 'b97be2650f9a787230611c5c49941e51be697dea848ead8ba7f1d62d51e05055'}, 'experimental-bridge-image.tar': {'bytes': 739129856, 'sha256': 'e73cec30e41645286d5438c780147cce1742d69b939329ffe59885739de14dd1'}, 'final-context.tar': {'bytes': 8775680, 'sha256': 'b6ba76057665a0773fb1f9f25be1984ce1075d2eaa55359a0eb061356bca2909'}, 'genomez-eufy-sdk-0.2.1-s1.experimental.7.tgz': {'bytes': 1845615, 'sha256': '19bf92f2062ae103ede942896ffa1310996778b5a9a5876b9ae2c9df91c60ffe'}, 'genomez-ha-eufy-sdk-bridge-0.3.1-s1.experimental.7.tgz': {'bytes': 120466, 'sha256': '592fb6ae22edca39c80978c73e245ac9f88938fbbdf4d6cfaa40f3fc7dc5d3bc'}, 'README.md': {'bytes': 1502, 'sha256': '47aca26b10e3abbfec524274e19e0575a665f70edee714d2daaa32d0663bdd93'}, 'REBUILD.md': {'bytes': 7265, 'sha256': '179f3e0b3615262943b28fe5a241017e671a0e767b513d4a10d571aa7565be59'}, 'SHA256SUMS': {'bytes': 678, 'sha256': 'ac619d1043e42a17220f3ae9941d4a165c21b9c0497c255836872e0c3ded0e48'}}
          for name, item in expected.items():
              p = Path(name)
              assert p.stat().st_size == item['bytes'], name
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == item['sha256'], name
          PY
          sha256sum --check SHA256SUMS
          docker load --input experimental-bridge-image.tar
          docker image inspect "$IMAGE_ID" > image.json
          python3 - <<'PY'
          import json, os
          i = json.load(open('image.json'))[0]
          assert i['Id'] == os.environ['IMAGE_ID']
          assert i['Architecture'] == 'amd64' and i['Os'] == 'linux'
          assert i['Config']['Labels']['io.hass.version'] == '0.4.1-s1.experimental.7'
          assert 'BRIDGE_RTC_COMMAND_KEEPALIVE_MS=29000' in i['Config']['Env']
          assert i['RootFS']['Layers'] == ['sha256:04d250f6eeaf2011583ac6a048be58eb54b859892b396d87a9f6c3e57c64f592', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:839a6160c64da9f9b45d5402fb7b27d90f543636fd6f2d760adfc7ea0f33221c', 'sha256:361308876f774e750d0698c92e535b74c63f509aab2a43e8f5f2e630c21fcfac', 'sha256:0947d3f969c91b0492aacebc6249c9996e9eeac2883be7ed8a058cfe72db8b80', 'sha256:2b9a88b765d9e92099a45b31efd181ac5bb6a58aa8972f825280ad56dc6e62c3', 'sha256:40aba6aa9c72c41394379c54d9aa145460ea51a4704573e7ab12dcc4d65fd599', 'sha256:68e8f31ed92384d66383e7c20d6210603964a4bbebfb5cd08aa0e1dbbdd104a7']
          PY
      - name: Publish without rebuilding or replacing a different image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/s1-registry-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username genomez --password-stdin
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = 'genomez/eufy-sdk-s1-amd64'
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + repo + ':pull,push'})
          basic = base64.b64encode(('genomez:' + os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + basic})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/' + repo + '/manifests/0.4.1-s1.experimental.7', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest = json.load(response)
                  assert manifest['config']['digest'] == os.environ['IMAGE_ID'], 'Refusing to replace a different image'
                  absent = False
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise RuntimeError('Registry lookup failed with HTTP ' + str(error.code)) from None
                  codes = {e.get('code') for e in json.load(error).get('errors', [])}
                  if not codes or not codes.issubset({'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}):
                      raise RuntimeError('Registry lookup did not establish tag absence')
                  absent = True
              with open(os.environ['RUNNER_TEMP'] + '/s1-tag-absent', 'w') as output:
                  output.write('true' if absent else 'false')
          except Exception as error:
              raise SystemExit('Registry guard stopped publication: ' + type(error).__name__) from None
          PY
          if [ "$(cat "$RUNNER_TEMP/s1-tag-absent")" = true ]; then
            docker tag "$IMAGE_ID" "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          docker pull "$IMAGE_TAG"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "$IMAGE_ID"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exact image published. Anonymous access and recipient source downloads require independent verification.' >> "$GITHUB_STEP_SUMMARY"
